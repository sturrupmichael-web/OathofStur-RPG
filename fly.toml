# Fly.io settings for the online world. One machine only: each machine would be
# a separate world, so deploys use --ha=false (see .github/workflows/deploy.yml).
app = "oath-of-stur"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a sleeping server would drop everyone in the world.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
