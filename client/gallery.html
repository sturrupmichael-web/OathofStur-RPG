<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model gallery</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b2430; color: #eee; font: 13px system-ui, sans-serif; overflow: hidden; }
      #bar { position: fixed; top: 0; left: 0; right: 0; padding: 6px 10px; background: rgba(0, 0, 0, 0.45); display: flex; gap: 8px; flex-wrap: wrap; z-index: 1; }
      #bar button { background: #2c3a4c; color: #eee; border: 1px solid #44566e; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
      #bar button.on { background: #4a6a96; }
      #names { position: fixed; bottom: 6px; left: 0; right: 0; text-align: center; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="names"></div>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
