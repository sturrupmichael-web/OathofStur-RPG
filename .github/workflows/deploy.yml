name: Deploy online world

# Builds the game server (which also serves the client) and deploys it to Fly.io.
# Needs the FLY_API_TOKEN repository secret (an org deploy token).
on:
  push:
    branches: [main, claude/project-thread-z7jlud]
    paths: [client/**, shared/**, server/**, Dockerfile, fly.toml, package-lock.json, .github/workflows/deploy.yml]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # First run only: make the app (later runs find it already there).
      - run: flyctl status --app oath-of-stur >/dev/null 2>&1 || flyctl apps create oath-of-stur --org personal
      - run: flyctl deploy --remote-only --ha=false
