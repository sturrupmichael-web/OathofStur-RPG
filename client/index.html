<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Oath of Stur</title>
  </head>
  <body>
    <div id="app">
      <main id="viewport">
        <div id="labels"></div>
        <div id="combat-layer"></div>
        <div id="tooltip" hidden></div>
        <div id="xp-drops" aria-hidden="true"></div>
        <div id="level-up" role="status" hidden></div>
        <div id="quest-complete" role="status" hidden></div>
        <div id="boss-bar" hidden><span id="boss-name"></span><div id="boss-hp"><div id="boss-hp-fill"></div></div></div>
        <div id="dialogue" role="dialog" aria-live="polite" hidden></div>
        <div id="window" role="dialog" aria-labelledby="win-title" hidden>
          <div class="win-head"><span id="win-title"></span><button id="win-close" aria-label="Close">✕</button></div>
          <div id="win-body"></div>
          <div id="win-foot"></div>
        </div>
        <div id="controls-hint">
          <span class="hint-mouse">Click to walk, attack or talk · Right-click for options · Q/E or middle-drag to rotate · Wheel to zoom · R toggles roofs</span>
          <span class="hint-touch">Tap to walk · Hold for options · Drag to turn · Pinch to zoom</span>
        </div>
        <div id="camera-buttons" aria-label="Camera">
          <button data-cam="left" aria-label="Rotate left">⟲</button>
          <button data-cam="right" aria-label="Rotate right">⟳</button>
          <button data-cam="in" aria-label="Zoom in">+</button>
          <button data-cam="out" aria-label="Zoom out">−</button>
          <button data-cam="roofs" aria-label="Toggle roofs">⌂</button>
        </div>
        <div id="worldmap" role="dialog" aria-labelledby="worldmap-title" hidden>
          <div class="win-head"><span id="worldmap-title">The Vell Reaches</span><button id="worldmap-close" aria-label="Close">✕</button></div>
          <div id="worldmap-skills" aria-label="Skills"></div>
          <canvas id="worldmap-canvas" aria-label="Region map. Tap a tile to walk there."></canvas>
          <p id="worldmap-note"></p>
        </div>
      </main>
      <aside id="side">
        <div id="minimap-wrap">
          <canvas id="minimap" aria-label="Minimap"></canvas>
          <button id="worldmap-open" aria-label="Open the region map">Map</button>
        </div>
        <div id="player-card">
          <span id="player-name">…</span>
          <span id="region"></span>
          <span id="combat-level"></span>
          <div id="hp-bar" title="Hitpoints"><div id="hp-fill"></div><span id="hp-text"></span></div>
        </div>
        <nav class="tabs">
          <button class="tab active" data-tab="inventory">Inventory</button>
          <button class="tab" data-tab="equipment">Equipment</button>
          <button class="tab" data-tab="skills">Skills</button>
          <button class="tab" data-tab="quests">Quests</button>
          <button class="tab" data-tab="options" aria-label="Options">⚙</button>
        </nav>
        <section class="panel" id="panel-inventory">
          <div id="inventory-grid"></div>
        </section>
        <section class="panel" id="panel-equipment" hidden>
          <div id="equipment-grid"></div>
          <div id="equip-stats"></div>
          <h3>Fighting style</h3>
          <div id="attack-styles"></div>
        </section>
        <section class="panel" id="panel-skills" hidden>
          <div id="skills-grid"></div>
          <div id="total-level"></div>
        </section>
        <section class="panel" id="panel-quests" hidden>
          <div id="quest-points"></div>
          <div id="quest-list"></div>
        </section>
        <section class="panel" id="panel-options" hidden>
          <h3>Sound</h3>
          <div class="sound-row">
            <button id="sound-toggle" aria-pressed="true">Sound on</button>
            <input id="sound-volume" type="range" min="0" max="100" value="70" aria-label="Volume" />
          </div>
          <h3>Your save</h3>
          <p class="muted" id="save-status">Your progress saves in this browser automatically.</p>
          <div class="option-buttons">
            <button id="save-now">Save now</button>
            <button id="save-export">Export save file</button>
            <label class="file-button">Import save file<input id="save-import" type="file" accept=".json,application/json" /></label>
            <button id="save-reset" class="danger">Start a new character</button>
          </div>
        </section>
      </aside>
      <footer id="chat">
        <div id="chat-log" aria-live="polite"></div>
        <input id="chat-input" placeholder="Player chat arrives with multiplayer" disabled />
      </footer>
    </div>
    <div id="context-menu" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
